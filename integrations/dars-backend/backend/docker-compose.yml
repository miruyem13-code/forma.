services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dars
      POSTGRES_PASSWORD: dars_dev_only
      POSTGRES_DB: dars
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dars_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dars -d dars"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dars_postgres:
